ServerTokens Prod
ServerSignature Off

# Only public/ is web-served, under APP_BASE_PATH (default /dofus, see Dockerfile). Keep it in sync
# with APP_URL. The Dofus client loads its data from <base>/lang and the launcher uses <base>/launcher.
Alias ${APP_BASE_PATH} /var/www/jloco-web/public

<Directory /var/www/jloco-web/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
    # Every path that is not a real file goes to the front controller.
    FallbackResource ${APP_BASE_PATH}/index.php
</Directory>

RedirectMatch 302 ^/$ ${APP_BASE_PATH}/
